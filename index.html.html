<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéMundo | Mi Pokédex</title>
<style>
:root{--red:#e63946;--ink:#20243a;--muted:#687086;--paper:#f5f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink)}
header{background:linear-gradient(135deg,#e63946,#ff7b54);color:white;padding:30px 18px 36px;text-align:center}
.logo{font-size:2.2rem;font-weight:900;letter-spacing:-1px;margin:0}.logo span{color:#ffe66d}
header p{margin:8px 0 20px;color:#fff3f0}
.search-wrap{max-width:700px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}
input,select{border:0;border-radius:12px;padding:13px 15px;font-size:1rem;outline:2px solid transparent}
input:focus,select:focus{outline-color:#ffe66d}input{flex:1;min-width:190px}select{background:white;color:var(--ink)}
main{max-width:1150px;margin:24px auto;padding:0 16px}
.info{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px}
.pokemon{background:var(--card);border-radius:18px;padding:16px;text-align:center;box-shadow:0 5px 18px #2222;border:1px solid #e9ecf3;cursor:pointer;transition:transform .18s,box-shadow .18s}
.pokemon:hover{transform:translateY(-4px);box-shadow:0 10px 25px #2222}
.pokemon img{width:125px;height:125px;object-fit:contain;image-rendering:auto}
.number{color:#9097a8;font-weight:700;font-size:.85rem}.name{text-transform:capitalize;font-size:1.1rem;font-weight:800;margin:4px 0 10px}
.types{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.type{font-size:.75rem;padding:5px 9px;border-radius:20px;background:#edf0f6;color:#30364a;font-weight:700;text-transform:capitalize}
button{border:0;border-radius:11px;padding:11px 16px;background:var(--ink);color:white;font-weight:700;cursor:pointer}button:hover{opacity:.88}button:disabled{opacity:.45;cursor:wait}
#loadMore{display:block;margin:28px auto}.status{text-align:center;color:var(--muted);padding:25px}
footer{text-align:center;padding:26px;color:var(--muted);font-size:.9rem}
.modal{position:fixed;inset:0;background:#111a;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}
.dialog{background:white;border-radius:22px;max-width:430px;width:100%;padding:25px;text-align:center;position:relative;box-shadow:0 20px 60px #0004}
.close{position:absolute;right:14px;top:14px;background:#f0f1f6;color:var(--ink);padding:7px 11px}.dialog img{width:170px;height:170px;object-fit:contain}.dialog h2{text-transform:capitalize;margin:0 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.stat{background:#f4f6fa;padding:10px;border-radius:12px}.stat strong{display:block;font-size:1.05rem}.stat small{color:var(--muted)}
@media(max-width:480px){.logo{font-size:1.8rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pokemon{padding:12px}.pokemon img{width:100px;height:100px}}
</style>
</head>
<body>
<header>
  <h1 class="logo">⚡ Poké<span>Mundo</span></h1>
  <p>¡Explora, busca y descubre tus Pokémon favoritos!</p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Busca por nombre o número..." aria-label="Buscar Pokémon">
    <select id="typeFilter" aria-label="Filtrar por tipo"><option value="">Todos los tipos</option></select>
  </div>
</header>
<main>
  <div class="info"><strong id="count">Preparando la Pokédex…</strong><span>Haz clic en una tarjeta para ver sus datos</span></div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="status" class="status">Conectando con la PokéAPI…</p>
  <button id="loadMore" hidden>Mostrar más Pokémon</button>
</main>
<footer>Proyecto educativo · Hecho con HTML, CSS y JavaScript · Datos de PokéAPI</footer>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
  <div class="dialog">
    <button class="close" id="close" aria-label="Cerrar">✕</button>
    <img id="detailImage" alt="">
    <div class="number" id="detailNumber"></div>
    <h2 id="modalName"></h2>
    <div class="types" id="detailTypes"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<script>
const API='https://pokeapi.co/api/v2';
const grid=document.querySelector('#grid'),statusEl=document.querySelector('#status'),countEl=document.querySelector('#count');
const search=document.querySelector('#search'),typeFilter=document.querySelector('#typeFilter'),loadMore=document.querySelector('#loadMore');
let allPokemon=[],offset=0,loading=false;
const typeNames={normal:'Normal',fire:'Fuego',water:'Agua',electric:'Eléctrico',grass:'Planta',ice:'Hielo',fighting:'Lucha',poison:'Veneno',ground:'Tierra',flying:'Volador',psychic:'Psíquico',bug:'Bicho',rock:'Roca',ghost:'Fantasma',dragon:'Dragón',dark:'Siniestro',steel:'Acero',fairy:'Hada'};
function spanishType(t){return typeNames[t]||t}
function imageFor(p){return p.sprites?.other?.['official-artwork']?.front_default||p.sprites?.front_default||''}
function createCard(p){
 const card=document.createElement('article');card.className='pokemon';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Ver detalles de '+p.name);
 const img=document.createElement('img');img.loading='lazy';img.src=imageFor(p);img.alt=p.name;
 const num=document.createElement('div');num.className='number';num.textContent='#'+String(p.id).padStart(3,'0');
 const name=document.createElement('div');name.className='name';name.textContent=p.name;
 const types=document.createElement('div');types.className='types';
 p.types.forEach(t=>{const b=document.createElement('span');b.className='type';b.textContent=spanishType(t.type.name);types.append(b)});
 card.append(img,num,name,types);card.addEventListener('click',()=>showDetails(p));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetails(p)}});
 return card
}
function render(){
 const q=search.value.trim().toLowerCase(),type=typeFilter.value;
 const filtered=allPokemon.filter(p=>(!q||p.name.toLowerCase().includes(q)||String(p.id)===q||String(p.id).padStart(3,'0')===q)&&(!type||p.types.some(t=>t.type.name===type)));
 grid.replaceChildren(...filtered.map(createCard));
 countEl.textContent=`${filtered.length} Pokémon mostrados`;
 statusEl.textContent=filtered.length?'':'No encontramos Pokémon con esa búsqueda. Prueba otro nombre o tipo.';
}
async function loadBatch(){
 if(loading)return;loading=true;loadMore.disabled=true;statusEl.textContent='Cargando Pokémon…';
 try{
  const response=await fetch(`${API}/pokemon?limit=24&offset=${offset}`);
  if(!response.ok)throw new Error('No se pudo consultar la PokéAPI');
  const data=await response.json();
  const batch=await Promise.all(data.results.map(async item=>{const r=await fetch(item.url);return r.json()}));
  allPokemon.push(...batch);offset+=data.results.length;
  const types=[...new Set(allPokemon.flatMap(p=>p.types.map(t=>t.type.name)))].sort();
  const current=typeFilter.value;typeFilter.replaceChildren(new Option('Todos los tipos',''),...types.map(t=>new Option(spanishType(t),t)));typeFilter.value=current;
  render();loadMore.hidden=!data.next;statusEl.textContent=''; 
 }catch(e){statusEl.textContent='No pudimos cargar los datos. Revisa tu conexión y vuelve a intentarlo.'}
 finally{loading=false;loadMore.disabled=false}
}
function showDetails(p){
 document.querySelector('#detailImage').src=imageFor(p);document.querySelector('#detailImage').alt=p.name;
 document.querySelector('#detailNumber').textContent='N.º '+String(p.id).padStart(3,'0');
 document.querySelector('#modalName').textContent=p.name;
 const types=document.querySelector('#detailTypes');types.replaceChildren(...p.types.map(t=>{const s=document.createElement('span');s.className='type';s.textContent=spanishType(t.type.name);return s}));
 const statNames={hp:'PS',attack:'Ataque',defense:'Defensa','special-attack':'At. especial','special-defense':'Def. especial',speed:'Velocidad'};
 const stats=document.querySelector('#stats');stats.replaceChildren(...p.stats.map(s=>{const d=document.createElement('div');d.className='stat';const strong=document.createElement('strong');strong.textContent=s.base_stat;const small=document.createElement('small');small.textContent=statNames[s.stat.name]||s.stat.name;d.append(strong,small);return d}));
 document.querySelector('#modal').classList.add('open');document.querySelector('#close').focus()
}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
search.addEventListener('input',render);typeFilter.addEventListener('change',render);loadMore.addEventListener('click',loadBatch);
document.querySelector('#close').addEventListener('click',closeModal);
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
loadBatch();
</script>
</body>
</html>
